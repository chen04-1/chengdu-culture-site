<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>巴城老街风景</title><link rel="stylesheet" href="style.css"></head><body class="extension-page"><main class="old-town"><h1>巴城老街风景</h1><p>巴城老街位于江苏的阳澄湖。在江南，人们都喜欢吃又香又肥腻的阳澄湖大闸蟹，大闸蟹的产地就在巴城。相传第一个吃螃蟹的人巴解就是巴城老街的人。</p></main><p class="back"><a href="index.html">返回练习目录</a></p></body></html>
